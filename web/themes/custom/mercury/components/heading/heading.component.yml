"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Heading
group: Base
status: stable
props:
  type: object
  required:
    - text_color
    - text_size
    - align
  properties:
    heading_text:
      type: string
      title: Heading
      default: "Enter title"
      examples:
        - Your heading goes here
    level:
      type: number
      title: Heading level
      enum: [1, 2, 3, 4, 5, 6]
      examples:
        - 2
    text_size:
      type: string
      title: Text size
      enum:
        - default
        - heading-responsive-8xl
        - heading-responsive-7xl
        - heading-responsive-6xl
        - heading-responsive-5xl
        - heading-responsive-4xl
        - heading-responsive-3xl
        - heading-responsive-2xl
        - heading-responsive-xl
        - heading-responsive-lg
      meta:enum:
        default: Default for heading level
        heading-responsive-8xl: 8XL
        heading-responsive-7xl: 7XL
        heading-responsive-6xl: 6XL
        heading-responsive-5xl: 5XL
        heading-responsive-4xl: 4XL
        heading-responsive-3xl: 3XL
        heading-responsive-2xl: 2XL
        heading-responsive-xl: XL
        heading-responsive-lg: L
      examples:
        - heading-responsive-4xl
    text_color:
      type: string
      title: Text color
      enum:
        - default
        - inverted
        - primary
        - muted
        - accent
      meta:enum:
        default: Default
        inverted: Inverted text
        primary: Primary
        muted: Muted
        accent: Accent
      examples:
        - default
    align:
      type: string
      title: Text alignment
      enum:
        - left
        - center
        - right
      meta:enum:
        left: Left
        center: Center
        right: Right
      examples:
        - left
    url:
      type: string
      title: Link
      format: uri-reference
    highlight_text:
      type: string
      title: Highlighted text
      description: A phrase inside the heading to colour with the highlight colour. Must match the heading text exactly. Leave empty for no highlight.
      examples:
        - Bundle name
    highlight_color:
      type: string
      title: Highlight colour
      description: Token colour for the highlighted phrase. Use accent only on a dark or primary background.
      enum:
        - accent
        - primary
        - secondary
      meta:enum:
        accent: Accent
        primary: Primary
        secondary: Secondary
      default: accent
      examples:
        - accent
    break_after:
      type: string
      title: Line break after
      description: A phrase after which the heading breaks onto a new line from the lg breakpoint up (below lg it wraps naturally). Must match the heading text exactly. Leave empty for no forced break.
      examples:
        - Give $100 or more.
