"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Badge
group: Base
status: stable
props:
  type: object
  required:
    - label
    - style
  properties:
    label:
      type: string
      title: Link text
      examples:
        - Badge text
    url:
      type: string
      title: Link
      format: uri-reference
    style:
      type: string
      title: Style
      enum:
        - primary
        - secondary
      meta:enum:
        primary: Primary
        secondary: Secondary
      examples:
        - primary
    shape:
      type: string
      title: Shape
      description: Corner shape. "Pill" uses the brand pill radius token. Default keeps the stock rounded corners.
      enum:
        - default
        - pill
      meta:enum:
        default: Default
        pill: Pill
      default: default
      examples:
        - default
    icon:
      type: string
      title: Icon name
      description: 'The ID of an icon from the <a href="https://phosphoricons.com/" target="_blank">Phosphor Icons</a> library.'
      default: "rocket"
      examples:
        - "rocket"
    icon_first:
      type: boolean
      title: Icon first
      default: true
      examples:
        - true
